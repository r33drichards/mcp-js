[package]
name = "mcp-metadata-store"
version = "0.1.0"
edition = "2024"

# Keep these lints local as Nix builds ./server without the repository workspace.
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
# Keep existing call sites buildable while surfacing errors they discard.
let_underscore_must_use = "warn"
map_err_ignore = "warn"
match_wild_err_arm = "warn"
panic_in_result_fn = "warn"
unwrap_used = "warn"
expect_used = "warn"
unnecessary_wraps = "warn"
# Preserve Clippy's default error for ignored partial reads and writes.
unused_io_amount = "deny"

[dependencies]
async-trait = "0.1"
sled = "0.34"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
aws-sdk-dynamodb = { version = "1", optional = true }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
tempfile = "3"

[features]
default = ["dynamodb"]
dynamodb = ["dep:aws-sdk-dynamodb"]
testcontainers-tests = ["dynamodb", "dep:testcontainers"]

[dependencies.testcontainers]
version = "0.25"
optional = true
