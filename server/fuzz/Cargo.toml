[package]
name = "server-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# The old `<1.0.220` pin (for swc_config 2.0.0's use of the removed
# `serde::__private` API) is gone: the server now pulls swc_common ≥18, and
# nono's build tooling requires serde ≥1.0.228.
serde = "1.0.228"
# Used by the fs fuzz targets: same versions the server crate uses.
bincode = "1"
blake3 = "1"
futures = "0.3"

[dependencies.server]
path = ".."

[dependencies.deno_core]
version = "0.381"

# Override rmcp to use the same git source as the server crate
[patch.crates-io]
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "787cc015b719773f66d4ac32e695b9a0079e12ef" }
# Fixes Vec<&str> heap leak in prepare_for_snapshot; upstream PR pending.
deno_core = { git = "https://github.com/r33drichards/deno_core", rev = "1c97a0ad596fed8c258803c020194243ef4441cc" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_execute_stateless"
path = "fuzz_targets/fuzz_execute_stateless.rs"
doc = false

[[bin]]
name = "fuzz_execute_stateful"
path = "fuzz_targets/fuzz_execute_stateful.rs"
doc = false

[[bin]]
name = "fuzz_snapshot_deserialization"
path = "fuzz_targets/fuzz_snapshot_deserialization.rs"
doc = false

[[bin]]
name = "fuzz_wasm_compile"
path = "fuzz_targets/fuzz_wasm_compile.rs"
doc = false

[[bin]]
name = "fuzz_fs_operations"
path = "fuzz_targets/fuzz_fs_operations.rs"
doc = false

[[bin]]
name = "fuzz_fetch_operations"
path = "fuzz_targets/fuzz_fetch_operations.rs"
doc = false

[[bin]]
name = "fuzz_parameter_validation"
path = "fuzz_targets/fuzz_parameter_validation.rs"
doc = false

[[bin]]
name = "fuzz_module_resolution"
path = "fuzz_targets/fuzz_module_resolution.rs"
doc = false

[[bin]]
name = "fuzz_fs_chunker"
path = "fuzz_targets/fuzz_fs_chunker.rs"
doc = false

[[bin]]
name = "fuzz_fs_tree_codec"
path = "fuzz_targets/fuzz_fs_tree_codec.rs"
doc = false

[[bin]]
name = "fuzz_fs_mount"
path = "fuzz_targets/fuzz_fs_mount.rs"
doc = false

[[bin]]
name = "fuzz_fs_merge"
path = "fuzz_targets/fuzz_fs_merge.rs"
doc = false

[[bin]]
name = "fuzz_fs_content_merge"
path = "fuzz_targets/fuzz_fs_content_merge.rs"
doc = false

