[package]
name = "engine-cluster-tests"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["fuzz"]

[features]
real-sled = ["turmoil/unstable-fs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
deno_core = { git = "https://github.com/r33drichards/deno_core", rev = "986c8b20c87024cc335cf18f6d14d55c0719a394" }
tokio = { version = "1", features = ["full"] }
turmoil = "=0.7.2"
server = { path = ".." }

[dev-dependencies]
turmoil = "0.7.2"
