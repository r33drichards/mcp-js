[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
cli-derive = { path = "cli-derive" }
anyhow = "1.0.98"
axum = "0.8.4"
rmcp = { version = "1.7", features = ["server", "client", "macros", "schemars", "server-side-http", "transport-streamable-http-server", "transport-io", "transport-child-process", "client-side-sse", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
# Legacy rmcp pinned ONLY for its standalone HTTP+SSE server transport, which
# rmcp 1.x dropped. Renamed so it coexists with the primary `rmcp` 1.x above;
# used solely by mcp_sse.rs to keep `--sse-port` working.
rmcp_legacy = { package = "rmcp", git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "787cc015b719773f66d4ac32e695b9a0079e12ef", features = ["transport-sse-server"] }

# rmcp = { version = "0.1.5", }
# Minimum-version bound (was pinned `=1.0.219`; nono's build tooling needs
# serde ≥1.0.228, and Cargo.lock still pins the exact resolved version).
serde = "1.0.219"
serde_json = "1.0.140"
toml = "0.8"
tokio = { version = "1.45.0", features = ["rt-multi-thread", "process", "signal", "time", "sync", "macros", "net", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
deno_core = "0.381"
deno_error = "0.7"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
async-trait = "0.1"
libc = "0.2"
# "string" enables owned (runtime-computed) builder values, used by the
# --config loader to install config-file values as per-arg defaults.
clap = { version = "4.5", features = ["derive", "env", "string"] }
sha2 = "0.10"
# swc_common ≥18 is required for serde ≥1.0.228 compatibility, which nono's
# build tooling needs; 17.x pulled swc_common 8.1.1, which used the removed
# `serde::__private` API and forced the old `=1.0.219` serde pin. 54 is the
# newest line that still compiles on the nix-pinned stable toolchain.
swc_core = { version = "54", features = [
    "common",
    "ecma_codegen",
    "ecma_parser",
    "ecma_transforms",
    "ecma_transforms_typescript",
    "ecma_visit",
] }
sled = "0.34"
chrono = { version = "0.4", features = ["serde"] }
hyper = { version = "1.5.2", features = ["server", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
tokio-util = "0.7"
rand = "0.8"
http-body-util = "0.1"
regorus = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
futures = "0.3"
wasmparser = "0.225"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "6"
jsonwebtoken = "9"
utoipa = { version = "4", features = ["axum_extras"] }
fastcdc = "3"
zstd = "0.13"
blake3 = "1"
bincode = "1"
diffy = "0.4"

# OS-level sandboxing layer (--sandbox-manifest): Landlock on Linux, Seatbelt on macOS.
# default-features = false drops nono's system-keyring integration, which the
# server does not use. 0.53 is the newest release whose MSRV (1.74) fits the
# nix-pinned stable toolchain; 0.54+ requires Rust 1.95.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nono = { version = "0.53", default-features = false }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls"], default-features = false }
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
sled = "0.34"