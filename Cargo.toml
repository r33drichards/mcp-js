[workspace]
members = [
    "server/metadata-store",
    "server",
    "mcp-v8-client",
    "mcp-v8-uniffi",
    "mcp-v8-uniffi-python",
]
resolver = "2"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
# Keep existing call sites buildable while surfacing errors they discard.
let_underscore_must_use = "warn"
map_err_ignore = "warn"
match_wild_err_arm = "warn"
panic_in_result_fn = "warn"
unwrap_used = "warn"
expect_used = "warn"
unnecessary_wraps = "warn"
# Preserve Clippy's default error for ignored partial reads and writes.
unused_io_amount = "deny"

# V8-linked binaries with full debug info are ~600MB each and slow to link;
# line tables keep usable panic backtraces at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[patch.crates-io]
# Fork-probe for the URL-parser benchmark (see docs/url-impl-benchmark.md):
# rust-url with the whatwg/url#963 host-retention behavior.
url = { path = "server/vendor/url" }

