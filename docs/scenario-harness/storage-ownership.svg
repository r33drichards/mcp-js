<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
</defs>
<rect width="960" height="640" fill="#020617"/><rect width="960" height="640" fill="url(#grid)"/>
<text x="30" y="36" fill="#e2e8f0" font-size="15">storage ownership - generation fencing (host n0)</text>
<text x="30" y="56" fill="#64748b" font-size="10">only the owning host touches sled; workers and observers never hold handles</text>
<rect x="60" y="90" width="840" height="250" rx="12" fill="#020617"/><rect x="60" y="90" width="840" height="250" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="75" y="112" fill="#fbbf24" font-size="9">GENERATION 1 (incarnation) - host runtime owns everything</text>
<rect x="90" y="130" width="200" height="70" rx="6" fill="#0f172a"/><rect x="90" y="130" width="200" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="105" y="155" fill="#6ee7b7" font-size="11">ClusterNode (Raft)</text>
<text x="105" y="173" fill="#64748b" font-size="8">holds sled::Db directly</text>
<text x="105" y="186" fill="#64748b" font-size="8">durable() - flush - fs_blobs</text>
<rect x="330" y="130" width="200" height="70" rx="6" fill="#0f172a"/><rect x="330" y="130" width="200" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="345" y="155" fill="#6ee7b7" font-size="11">Engine + ScenarioHost</text>
<text x="345" y="173" fill="#64748b" font-size="8">serves observer RPC on</text>
<text x="345" y="186" fill="#64748b" font-size="8">TcpListener (4301)</text>
<rect x="570" y="130" width="150" height="70" rx="6" fill="#0f172a"/><rect x="570" y="130" width="150" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="585" y="155" fill="#c4b5fd" font-size="11">sled::Db</text>
<text x="585" y="173" fill="#64748b" font-size="8">label store + ex: trees</text>
<text x="585" y="186" fill="#64748b" font-size="8">fs_blobs + console WAL</text>
<rect x="90" y="240" width="630" height="80" rx="6" fill="#0f172a"/><rect x="90" y="240" width="630" height="80" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
<text x="105" y="264" fill="#fdba74" font-size="11">Worker bridge (V8 spawn_blocking thread)</text>
<text x="105" y="282" fill="#64748b" font-size="8">HostConsoleWriter + HostBlobStorage: mpsc/oneshot channels only - no backend handle</text>
<text x="105" y="300" fill="#64748b" font-size="8">pump runs on the host tokio runtime; dropping the host aborts the pump (dropping_scenario_host_stops_its_blob_pump)</text>
<line x1="190" y1="200" x2="190" y2="240" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="430" y1="200" x2="430" y2="240" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="645" y1="200" x2="645" y2="310" stroke="#64748b" stroke-width="1.5"/>
<text x="652" y="330" fill="#475569" font-size="8">pump performs the sled writes on the host runtime</text>
<rect x="90" y="380" width="250" height="80" rx="6" fill="#0f172a"/><rect x="90" y="380" width="250" height="80" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="105" y="405" fill="#cbd5e1" font-size="11">observer client</text>
<text x="105" y="423" fill="#64748b" font-size="8">ScenarioHostClient::run_js / cas /</text>
<text x="105" y="436" fill="#64748b" font-size="8">resolve / read_file - serialized</text>
<text x="105" y="449" fill="#64748b" font-size="8">messages over simulated TCP</text>
<line x1="340" y1="420" x2="330" y2="200" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>
<text x="240" y="500" fill="#475569" font-size="8">requests carry and receive the host generation</text>
<rect x="420" y="380" width="200" height="80" rx="6" fill="#0f172a"/><rect x="420" y="380" width="200" height="80" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="435" y="405" fill="#fda4af" font-size="11">Sim::crash(n0)</text>
<text x="435" y="423" fill="#64748b" font-size="8">sled Db dropped with the host</text>
<text x="435" y="436" fill="#64748b" font-size="8">channels close: workers see</text>
<text x="435" y="449" fill="#64748b" font-size="8">"console owner stopped"</text>
<line x1="530" y1="380" x2="580" y2="240" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
<rect x="700" y="380" width="200" height="80" rx="6" fill="#0f172a"/><rect x="700" y="380" width="200" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="715" y="405" fill="#6ee7b7" font-size="11">Sim::bounce(n0)</text>
<text x="715" y="423" fill="#64748b" font-size="8">exclusive fresh reopen of the</text>
<text x="715" y="436" fill="#64748b" font-size="8">same on-disk store</text>
<text x="715" y="449" fill="#64748b" font-size="8">incarnation = generation + 1</text>
<line x1="700" y1="405" x2="620" y2="215" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>
<rect x="60" y="500" width="840" height="100" rx="6" fill="#0f172a"/><rect x="60" y="500" width="840" height="100" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="80" y="525" fill="#67e8f9" font-size="12">GENERATION 2 - fencing guarantees (verified by regressions)</text>
<text x="80" y="545" fill="#64748b" font-size="9">stale_console_writer_is_fenced_after_fresh_reopen: a pre-crash writer cannot write the reopened store (err, not silently lost)</text>
<text x="80" y="563" fill="#64748b" font-size="9">owner_two_crashes_keep_distinct_acknowledged_js_snapshots: each generation acks its own head; old cached handles fail closed</text>
<text x="80" y="581" fill="#64748b" font-size="9">pre-crash completed output IS durable; only post-crash stale writes are fenced (never the reverse)</text>
</svg>