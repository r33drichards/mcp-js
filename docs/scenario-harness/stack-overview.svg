<text x="60" y="124" fill="#64748b" font-size="9">seed - topology - workload(RunJs programs) - faults - recovery - asserts</text>
<rect x="600" y="80" width="280" height="64" rx="6" fill="#0f172a"/><rect x="600" y="80" width="280" height="64" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
