<rect x="490" y="500" width="390" height="64" rx="6" fill="#0f172a"/><rect x="490" y="500" width="390" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="510" y="526" fill="#c4b5fd" font-size="12">Storage boundary - patched vendored sled</text>
<text x="510" y="544" fill="#64748b" font-size="9">turmoil-fs underneath - ENOSPC reaches log flush - EIO reaches config write</text>
<line x1="235" y1="395" x2="235" y2="525" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="110" y="470" fill="#475569" font-size="8">models faults in memory</text>
<text x="110" y="482" fill="#475569" font-size="8">(no real I/O)</text>
<rect x="40" y="595" width="840" height="76" rx="6" fill="#0f172a"/><rect x="40" y="595" width="840" height="76" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="60" y="620" fill="#6ee7b7" font-size="12">ScenarioResult + assertions - checked-in regressions</text>
<text x="60" y="638" fill="#64748b" font-size="9">AckedCommitsInLegalHistory - FreshWriteSucceeds - ReplicasConvergeAfterRecovery - PublishedSnapshotMatchesModel</text>
<text x="60" y="656" fill="#64748b" font-size="9">failure artifacts replay deterministically; minimized scenario becomes the regression test</text>
