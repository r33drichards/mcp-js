<text x="505" y="323" fill="#fbbf24" font-size="9">TURMOIL SIMULATION (seeded, deterministic)</text>
<rect x="510" y="335" width="110" height="80" rx="6" fill="#0f172a"/><rect x="510" y="335" width="110" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="525" y="358" fill="#6ee7b7" font-size="11">host n0..n2</text>
<text x="525" y="374" fill="#64748b" font-size="8">ClusterNode Raft</text>
<text x="525" y="386" fill="#64748b" font-size="8">+ engine</text>
<text x="525" y="398" fill="#64748b" font-size="8">+ ScenarioHost RPC</text>
<rect x="640" y="335" width="110" height="80" rx="6" fill="#0f172a"/><rect x="640" y="335" width="110" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="655" y="358" fill="#6ee7b7" font-size="11">observer</text>
<text x="655" y="374" fill="#64748b" font-size="8">ScenarioHostClient</text>
<text x="655" y="386" fill="#64748b" font-size="8">runs RunJs remotely</text>
<rect x="770" y="335" width="95" height="80" rx="6" fill="#0f172a"/><rect x="770" y="335" width="95" height="80" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="785" y="358" fill="#fda4af" font-size="11">controller</text>
<text x="785" y="374" fill="#64748b" font-size="8">Sim::crash</text>
<text x="785" y="386" fill="#64748b" font-size="8">Sim::bounce</text>
<text x="785" y="398" fill="#64748b" font-size="8">partition/heal</text>
<text x="505" y="440" fill="#64748b" font-size="8">controller is the ONLY fault authority - observer/hosts exchange serialized RPC, never handles</text>
