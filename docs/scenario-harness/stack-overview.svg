<text x="60" y="330" fill="#cbd5e1" font-size="12">Modeled runner (handwritten, kept)</text>
<text x="60" y="348" fill="#64748b" font-size="9">in-memory cluster nodes - fast oracle track</text>
<text x="60" y="364" fill="#64748b" font-size="9">used by the fuzz target - distinct documented oracle</text>
