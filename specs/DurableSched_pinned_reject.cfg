\* The trap: retry from the pinned snapshot AND reject on conflict.
\* No crashes, no lease expiry, no interactive runs.
\* Expected TLC result: Invariant NoDead is violated. Two jobs claim on the
\* same head, one commits, the other can never commit and exhausts its attempts.
SPECIFICATION Spec
CONSTANTS
    Jobs = {"j1", "j2"}
    Workers = {"w1", "w2"}
    Steps = 2
    MaxAttempts = 3
    MaxUser = 0
    RetryBase = "pinned"
    OnConflict = "reject"
    Faults = FALSE
INVARIANT NoDead
