\* Last writer wins on conflict.
\* Expected TLC result: Action property HeadOnlyGrows is violated. A job
\* commit discards a write that was already in the session head.
SPECIFICATION Spec
CONSTANTS
    Jobs = {"j1", "j2"}
    Workers = {"w1", "w2"}
    Steps = 2
    MaxAttempts = 3
    MaxUser = 1
    RetryBase = "head"
    OnConflict = "clobber"
    Faults = TRUE
PROPERTY HeadOnlyGrows
