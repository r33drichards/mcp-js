[package]
name = "mcp-js-scheduler-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "=4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
tokio-cron-scheduler = "=0.15.1"

[dev-dependencies]
tempfile = "3"

# Experimental alternatives resolve independently of the V8 server workspace.
[workspace]
