# lychee ≥0.24 replaced the boolean with a mode string; "full" checks both
# anchor fragments and text fragments (the old `true` checked anchors).
include_fragments = "full"
max_retries = 3
retry_wait_time = 2
timeout = 20
verbose = "info"

exclude = [
  "^http://localhost(:[0-9]+)?(/|$)",
  "^http://127\\.0\\.0\\.1(:[0-9]+)?(/|$)",
  "^http://your-host(:[0-9]+)?(/|$)",
  "^https?://([a-z0-9-]+\\.)*example\\.com(/|$)",
  "^file:///path/to/.*$",
  "^file:///policies/.*$",
  "^http://\\.\\.\\.$",
  "^https?://([a-z0-9-]+\\.)*openpolicyagent\\.org(/|$)",
]
