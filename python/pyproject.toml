[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-js"
version = "0.1.0"
readme = "README.md"
description = "In-process JavaScript execution through the mcp-js UniFFI engine"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["mcp_js"]

[tool.setuptools.package-data]
mcp_js = ["*.so", "*.dylib"]
