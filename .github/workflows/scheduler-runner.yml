name: Apalis replicated runner
on:
  pull_request:
    paths: ['scheduler-runner/**', 'scheduler-core/**', 'server/src/cluster*', 'server/src/scheduled*', 'server/src/api.rs', 'server/src/main.rs', 'server/src/engine/**', 'server/Cargo.*', 'Cargo.*', '.github/workflows/scheduler-runner.yml']
  push:
    paths: ['scheduler-runner/**', 'scheduler-core/**', 'server/src/cluster*', 'server/src/scheduled*', 'server/src/api.rs', 'server/src/main.rs', 'server/src/engine/**', 'server/Cargo.*', 'Cargo.*', '.github/workflows/scheduler-runner.yml']
permissions:
  contents: read
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path scheduler-runner/Cargo.toml --check
      - run: cargo test --manifest-path scheduler-runner/Cargo.toml --locked
      - run: cargo clippy --manifest-path scheduler-runner/Cargo.toml --locked --all-targets -- -D warnings

  engine-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --locked -p server --lib scheduled_runtime_tests -- --nocapture
      - run: cargo test --locked -p server --lib execution_activity_tests -- --nocapture
      - run: cargo check --locked -p server --bin server
