name: Railway demand-liveness image

on:
  push:
    branches: [codex/railway-demand-liveness]
    paths:
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.source'
      - '.github/workflows/railway-demand-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-image:
    if: github.ref == 'refs/heads/codex/railway-demand-liveness'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in with existing Docker Hub publishing credential
        uses: docker/login-action@v3
        with:
          username: wholelottahoopla
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Test source and publish immutable rollout tag
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.source
          platforms: linux/amd64
          build-args: MCP_LIVENESS_TESTS=1
          push: true
          tags: wholelottahoopla/mcp-js:railway-demand-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=railway-demand
          cache-to: type=gha,mode=max,scope=railway-demand
