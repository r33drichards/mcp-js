name: HTTP functions NixOS integration
on:
  pull_request:
    paths: ['tests/nixos/http-functions*', 'server/src/**', 'nix/**', 'flake.nix', 'flake.lock', '.github/workflows/http-functions-nixos.yml']
  push:
    paths: ['tests/nixos/http-functions*', 'server/src/**', 'nix/**', 'flake.nix', 'flake.lock', '.github/workflows/http-functions-nixos.yml']
permissions:
  contents: read
jobs:
  nixos:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [http-functions-test, http-functions-cluster-test]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
            sandbox = false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run VM integration test
        run: nix build .#checks.x86_64-linux.${{ matrix.check }} --print-build-logs --no-link -L
