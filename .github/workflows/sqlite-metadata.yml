name: SQLite metadata integration
on:
  pull_request:
    paths:
      - 'server/src/**'
      - 'server/metadata-store/**'
      - 'server/tests/sqlite_integration.rs'
      - 'server/tests/runtime_storage_review.rs'
      - 'server/tests/blob_contract.rs'
      - 'server/tests/write_through_cache.rs'
      - 'server/tests/support/**'
      - 'server/tests/metadata_backends.rs'
      - 'server/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/actions/**'
      - '.github/workflows/sqlite-metadata.yml'
  push:
    branches: [main]
    paths:
      - 'server/src/**'
      - 'server/metadata-store/**'
      - 'server/tests/sqlite_integration.rs'
      - 'server/tests/runtime_storage_review.rs'
      - 'server/tests/blob_contract.rs'
      - 'server/tests/write_through_cache.rs'
      - 'server/tests/support/**'
      - 'server/tests/metadata_backends.rs'
      - 'server/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/actions/**'
      - '.github/workflows/sqlite-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
# New commits supersede older PR runs; independent branch pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: native-server
      - name: Storage contracts (SQLite and sled)
        run: cargo test --locked -p mcp-metadata-store --test contract --test content --test publication --test runtime_review
      - name: Shared blob backend and cache contracts
        run: cargo test --locked -p server --test blob_contract --test write_through_cache --test runtime_storage_review -- --test-threads=1
      - name: SQLite consumers
        run: cargo test --locked -p server --test metadata_backends sqlite -- --test-threads=1
      - name: SQLite integration and heap restore with both metadata backends
        run: cargo test --locked -p server --test sqlite_integration -- --test-threads=1
