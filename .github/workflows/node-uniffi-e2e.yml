name: Node UniFFI E2E

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - "LICENSE"
      - "server/**"
      - "mcp-v8-uniffi-python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/node-uniffi-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "node/**"
      - "LICENSE"
      - "server/**"
      - "mcp-v8-uniffi-python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/node-uniffi-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-uniffi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-client-nix-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build the HTTP npm tarball as a Nix derivation
        run: nix build .#npm-client
      - name: Verify the exact Nix tarball with an outside-Nix consumer
        run: |
          npm ci --include=dev --prefix clients/typescript
          timeout 180s node clients/typescript/scripts-test-package.mjs result/*.tgz

  node-library-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Restore native library build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target/python-uniffi
          key: python-uniffi-v8-145-e6a88b35-shared-v3-${{ runner.os }}-${{ hashFiles('flake.lock', 'mcp-v8-uniffi-python/cargo-config.toml') }}
          restore-keys: |
            python-uniffi-v8-145-shared-v2-${{ runner.os }}-
      - name: Restore Node generator build cache
        uses: actions/cache@v4
        with:
          path: target/node-bindgen
          key: node-uniffi-bindgen-v1-${{ runner.os }}-${{ hashFiles('node/patches/**', 'node/scripts/build-bindgen.sh', 'flake.lock') }}
      - name: Build the real native engine shared library
        run: |
          nix develop --command bash -c '
            unset RUSTY_V8_ARCHIVE
            export V8_FROM_SOURCE=1
            export GN_ARGS="v8_monolithic=true v8_monolithic_for_shared_library=true"
            export CARGO_TARGET_DIR="$PWD/target/python-uniffi"
            cargo build -p mcp-v8-uniffi-python --release \
              --config mcp-v8-uniffi-python/cargo-config.toml
          '
      - name: Save source-V8 build cache before later package checks
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target/python-uniffi
          key: python-uniffi-v8-145-e6a88b35-shared-v3-${{ runner.os }}-${{ hashFiles('flake.lock', 'mcp-v8-uniffi-python/cargo-config.toml') }}
      - name: Build pinned UniFFI TypeScript generator
        run: nix develop --command bash node/scripts/build-bindgen.sh
      - name: Install locked Node runtime and test dependencies
        run: npm ci --include=dev --prefix node
      - name: Test packaging tooling (no native fixtures)
        run: npm run test:unit --prefix node
      - name: Generate bindings from the real shared library
        run: |
          nix develop --command bash node/scripts/generate.sh \
            target/python-uniffi/release/libmcp_v8_uniffi.so
      - name: Build the native npm tarball as a Nix derivation
        run: |
          stage="$(mktemp -d)"
          tar --exclude=node/node_modules --exclude=node/dist -cf - LICENSE node | tar -C "$stage" -xf -
          NATIVE_NPM_SOURCE="$stage" nix build --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = flake.inputs.nixpkgs.legacyPackages.${builtins.currentSystem};
            in import ./nix/npm-native.nix {
              inherit pkgs;
              src = builtins.path {
                path = /. + builtins.getEnv "NATIVE_NPM_SOURCE";
                name = "mcp-js-node-source";
              };
            }
          '
      - name: Typecheck the Node program
        run: npm run typecheck --prefix node
      - name: Run Node against the native engine (no server or Python)
        run: timeout 90s npm test --prefix node
      - name: Compile relocatable npm package
        run: nix develop --command npm run build --prefix node
      - name: Pack and execute an isolated tarball consumer
        # Runs outside nix develop: Nix-only or unresolved dynamic dependencies fail prepack.
        run: timeout 240s node node/scripts/test-package.mjs result/*.tgz
