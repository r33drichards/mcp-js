name: Release publication policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*release*.yml'
      - '.github/workflows/docker-publish.yml'
      - 'scripts/release-policy*.mjs'
      - 'node/scripts/release-tag.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*release*.yml'
      - '.github/workflows/docker-publish.yml'
      - 'scripts/release-policy*.mjs'
      - 'node/scripts/release-tag.mjs'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release policy without external publication
        run: node --test scripts/release-policy.test.mjs
