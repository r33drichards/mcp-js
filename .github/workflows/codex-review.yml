name: Codex subscription review

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.label.name == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # This privileged job reads only trusted base-branch code, never the PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Request native Codex review and wait for completion
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          CODEX_REVIEW_REQUEST_TOKEN: ${{ secrets.CODEX_REVIEW_REQUEST_TOKEN }}
        with:
          github-token: ${{ secrets.CODEX_REVIEW_REQUEST_TOKEN || github.token }}
          script: |
            const run = require('./.github/scripts/codex-review.cjs');
            const requestToken = process.env.CODEX_REVIEW_REQUEST_TOKEN;
            const requester = requestToken ? github : null;
            await run({ github, requester, context, core });
