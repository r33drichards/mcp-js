name: Dynamic HTTP functions
on:
  pull_request:
    paths: ['server/src/**', 'server/tests/jwks_auth_e2e.rs', '.github/workflows/http-functions.yml']
  push:
    paths: ['server/src/**', 'server/tests/jwks_auth_e2e.rs', '.github/workflows/http-functions.yml']
permissions:
  contents: read
jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: rustfmt --edition 2024 --check server/src/http_functions.rs
      - run: cargo test --locked -p server --lib http_functions -- --test-threads=1
      - run: cargo test --locked -p server --test jwks_auth_e2e -- --test-threads=1
      - run: cargo test --locked -p server --lib scheduled_runtime_tests -- --test-threads=1
