name: Publish npm Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Build artifacts only, or publish after environment approval"
        required: true
        default: validate
        type: choice
        options: [validate, publish]
      package:
        description: "Package(s) to build or publish"
        required: true
        default: both
        type: choice
        options: [both, node, client]
      node_version:
        description: "Exact mcp-js-node version when node is selected"
        required: false
        type: string
      client_version:
        description: "Exact mcp-js-client version when client is selected"
        required: false
        type: string
      confirm_publish:
        description: "Required only in publish mode: npm trusted publishing is configured"
        required: true
        default: false
        type: boolean

# PRs, pushes, and pull_request_target never reach publish jobs. Manual
# validation can only build downloadable artifacts; publication additionally
# requires publish mode, explicit confirmation, and environment approval.
permissions:
  contents: read

jobs:
  build-tarballs:
    name: Build ${{ matrix.id }} tarball
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: node
            directory: node
            package: '@wholelottahoopla/mcp-js-node'
          - id: client
            directory: clients/typescript
            package: '@wholelottahoopla/mcp-js-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Select matrix package
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_SELECTION: ${{ inputs.package }}
          PACKAGE_ID: ${{ matrix.id }}
        run: |
          if [ "$EVENT_NAME" = release ] || [ "$PACKAGE_SELECTION" = both ] || [ "$PACKAGE_SELECTION" = "$PACKAGE_ID" ]; then
            echo selected=true >> "$GITHUB_OUTPUT"
          else
            echo selected=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.select.outputs.selected == 'true'
        with:
          fetch-depth: 0
      - name: Verify release/manual source and version input
        if: steps.select.outputs.selected == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_ID: ${{ matrix.id }}
          NODE_VERSION: ${{ inputs.node_version }}
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$EVENT_NAME" = release ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
            requested_version="${RELEASE_TAG#v}"
          else
            test "$GITHUB_REF" = refs/heads/main
            if [ "$PACKAGE_ID" = node ]; then
              requested_version="$NODE_VERSION"
            else
              requested_version="$CLIENT_VERSION"
            fi
            test -n "$requested_version"
            [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          fi
          test "$(node -p "require('./${{ matrix.directory }}/package.json').version")" = "$requested_version"
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.select.outputs.selected == 'true'
      - uses: actions/setup-node@v4
        if: steps.select.outputs.selected == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Require Node and npm versions supported for trusted publishing
        if: steps.select.outputs.selected == 'true'
        run: |
          node - <<'NODE'
          const version = command => require('child_process').execFileSync(command, ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          const [nodeMajor, nodeMinor] = version('node');
          const [npmMajor, npmMinor, npmPatch] = version('npm');
          if (nodeMajor < 22 || (nodeMajor === 22 && nodeMinor < 14)) throw new Error('Node.js 22.14.0 or newer is required for npm trusted publishing');
          if (npmMajor < 11 || (npmMajor === 11 && (npmMinor < 5 || (npmMinor === 5 && npmPatch < 1)))) throw new Error('npm CLI 11.5.1 or newer is required for npm trusted publishing');
          NODE
      - name: Install locked Node dependencies
        if: steps.select.outputs.selected == 'true'
        run: npm ci --include=dev --prefix '${{ matrix.directory }}'
      - name: Audit production dependency tree
        if: steps.select.outputs.selected == 'true'
        run: npm audit --omit=dev --prefix '${{ matrix.directory }}'
      - name: Build and verify HTTP client Nix tarball
        if: steps.select.outputs.selected == 'true' && matrix.id == 'client'
        run: |
          nix build .#npm-client
          timeout 180s node clients/typescript/scripts-test-package.mjs result/*.tgz
      - name: Restore reusable source-V8 build cache
        if: steps.select.outputs.selected == 'true' && matrix.id == 'node'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target/python-uniffi
          key: python-uniffi-v8-145-e6a88b35-shared-v3-${{ runner.os }}-${{ hashFiles('flake.lock', 'mcp-v8-uniffi-python/cargo-config.toml') }}
          restore-keys: |
            python-uniffi-v8-145-shared-v2-${{ runner.os }}-
      - name: Build and verify native engine tarball
        if: steps.select.outputs.selected == 'true' && matrix.id == 'node'
        run: |
          nix develop --command bash -c '
            unset RUSTY_V8_ARCHIVE
            export V8_FROM_SOURCE=1
            export GN_ARGS="v8_monolithic=true v8_monolithic_for_shared_library=true"
            export CARGO_TARGET_DIR="$PWD/target/python-uniffi"
            cargo build -p mcp-v8-uniffi-python --release \
              --config mcp-v8-uniffi-python/cargo-config.toml
          '
          nix develop --command bash node/scripts/build-bindgen.sh
          nix develop --command bash node/scripts/generate.sh \
            target/python-uniffi/release/libmcp_v8_uniffi.so
          stage="$(mktemp -d)"
          tar --exclude=node/node_modules --exclude=node/dist -cf - LICENSE node | tar -C "$stage" -xf -
          NATIVE_NPM_SOURCE="$stage" nix build --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = flake.inputs.nixpkgs.legacyPackages.${builtins.currentSystem};
            in import ./nix/npm-native.nix {
              inherit pkgs;
              src = builtins.path {
                path = /. + builtins.getEnv "NATIVE_NPM_SOURCE";
                name = "mcp-js-node-source";
              };
            }
          '
          npm run test:unit --prefix node
          npm run typecheck --prefix node
          timeout 90s npm test --prefix node
          nix develop --command npm run build --prefix node
          timeout 240s node node/scripts/test-package.mjs result/*.tgz
      - name: Pack exact release tarball
        if: steps.select.outputs.selected == 'true'
        id: pack
        env:
          DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          if compgen -G 'result/*.tgz' >/dev/null; then
            cp result/*.tgz release-artifacts/
            basename result/*.tgz > release-artifacts/tarball-name
            exit 0
          fi
          output="$(npm pack --json --pack-destination release-artifacts --prefix "$DIRECTORY")"
          node - "$output" <<'NODE' > release-artifacts/tarball-name
          const result = JSON.parse(process.argv[2]);
          const item = Array.isArray(result) ? result[0] : Object.values(result)[0];
          if (!item?.filename) throw new Error('npm pack did not return a filename');
          process.stdout.write(item.filename);
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.selected == 'true'
        with:
          name: npm-tarball-${{ matrix.id }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish selected npm package(s)
    needs: build-tarballs
    if: >-
      github.event_name == 'release' ||
      (github.ref == 'refs/heads/main' && inputs.mode == 'publish' &&
       inputs.confirm_publish == true)
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        if: github.event_name == 'release' || inputs.package == 'both' || inputs.package == 'node'
        with:
          name: npm-tarball-node
          path: release-artifacts/node
      - uses: actions/download-artifact@v4
        if: github.event_name == 'release' || inputs.package == 'both' || inputs.package == 'client'
        with:
          name: npm-tarball-client
          path: release-artifacts/client
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require Node and npm versions supported for trusted publishing
        run: |
          node - <<'NODE'
          const version = command => require('child_process').execFileSync(command, ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          const [nodeMajor, nodeMinor] = version('node');
          const [npmMajor, npmMinor, npmPatch] = version('npm');
          if (nodeMajor < 22 || (nodeMajor === 22 && nodeMinor < 14)) throw new Error('Node.js 22.14.0 or newer is required for npm trusted publishing');
          if (npmMajor < 11 || (npmMajor === 11 && (npmMinor < 5 || (npmMinor === 5 && npmPatch < 1)))) throw new Error('npm CLI 11.5.1 or newer is required for npm trusted publishing');
          NODE
      - name: Verify selected tarball identities and payloads
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_SELECTION: ${{ inputs.package }}
          NODE_VERSION: ${{ inputs.node_version }}
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: |
          set -euo pipefail
          verify() {
            id="$1" expected_name="$2" requested_version="$3"
            tarball="$(find "release-artifacts/$id" -type f -name '*.tgz' -print -quit)"
            test -n "$tarball"
            test "$(find "release-artifacts/$id" -type f -name '*.tgz' | wc -l)" = 1
            rm -rf unpacked
            mkdir unpacked
            tar -xzf "$tarball" -C unpacked
            expected_version="$requested_version"
            if [ "$EVENT_NAME" = release ]; then expected_version="${RELEASE_TAG#v}"; fi
            node - "$expected_name" "$expected_version" <<'NODE'
          const fs = require('fs');
          const [expectedName, expectedVersion] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync('unpacked/package/package.json', 'utf8'));
          if (manifest.name !== expectedName || manifest.version !== expectedVersion) {
            throw new Error(`tarball identity mismatch: ${manifest.name}@${manifest.version}`);
          }
          NODE
            tar -tzf "$tarball" | sort > contents.txt
            grep -qx 'package/package.json' contents.txt
            grep -qx 'package/README.md' contents.txt
          }
          if [ "$EVENT_NAME" = release ] || [ "$PACKAGE_SELECTION" = both ] || [ "$PACKAGE_SELECTION" = node ]; then
            verify node '@wholelottahoopla/mcp-js-node' "$NODE_VERSION"
          fi
          if [ "$EVENT_NAME" = release ] || [ "$PACKAGE_SELECTION" = both ] || [ "$PACKAGE_SELECTION" = client ]; then
            verify client '@wholelottahoopla/mcp-js-client' "$CLIENT_VERSION"
          fi
      - name: Publish native package with npm trusted publishing and provenance
        if: github.event_name == 'release' || inputs.package == 'both' || inputs.package == 'node'
        run: npm publish "$(find release-artifacts/node -type f -name '*.tgz' -print -quit)" --access public --provenance
      - name: Publish HTTP client with npm trusted publishing and provenance
        if: github.event_name == 'release' || inputs.package == 'both' || inputs.package == 'client'
        run: npm publish "$(find release-artifacts/client -type f -name '*.tgz' -print -quit)" --access public --provenance
