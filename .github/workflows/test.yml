name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    # Also gate pngjs's stacked PR before the Node compatibility branch lands.
    branches: [ main, claude/branch-status-xnlqaq ]

# New commits supersede older PR runs; independent branch pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Cache Nix development shell
        uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6 # v6
        with:
          primary-key: nix-shell-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'shell.nix') }}
          restore-prefixes-first-match: nix-shell-v2-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      # nix develop alone leaves the environment collectible after the command
      # exits. Keep a profile root until the cache action's post-job GC/save.
      - name: Root the Nix development shell and verify its closure
        shell: bash
        run: |
          nix develop --profile "$RUNNER_TEMP/mcp-js-devshell" --command bash -c '
            rustc_path=$(readlink -f "$(command -v rustc)")
            [[ "$rustc_path" == /nix/store/* ]] || exit 1
            [[ "${RUSTY_V8_ARCHIVE:-}" == /nix/store/* ]] || exit 1
            printf "%s\n" "$rustc_path" "$RUSTY_V8_ARCHIVE" > "$RUNNER_TEMP/mcp-js-nix-paths"
          '
          nix-store --gc --print-live > "$RUNNER_TEMP/mcp-js-nix-live-paths"
          while IFS= read -r store_path; do
            grep -Fxq -- "$store_path" "$RUNNER_TEMP/mcp-js-nix-live-paths" || {
              echo "Required Nix path is not protected from GC: $store_path" >&2
              exit 1
            }
          done < <(sed -n 's#^\(/nix/store/[^/]*\).*#\1#p' "$RUNNER_TEMP/mcp-js-nix-paths")

      - name: Cache Cargo dependencies with the Nix toolchain
        uses: ./.github/actions/rust-cache
        with:
          shared-key: nix-server-${{ hashFiles('flake.lock', 'flake.nix', 'shell.nix') }}
          cmd-format: nix develop --command {0}

      # cargo test builds the server binary and all test targets itself.
      # Cargo already prints captured output for failures; don't rerun the suite.
      - name: Run tests
        shell: bash
        run: nix develop --command cargo test --locked -p server -- --test-threads=1 2>&1 | tee test-results.log

      - name: Preserve failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-output-${{ github.run_attempt }}
          path: test-results.log
          if-no-files-found: ignore
