name: Cluster consensus regressions
on:
  pull_request:
    paths:
      - 'server/src/cluster*'
      - 'server/tests/cluster*'
      - 'server/cluster-tests/**'
      - '.github/actions/**'
      - '.github/workflows/cluster-consensus.yml'
  push:
    branches: [main]
    paths:
      - 'server/src/cluster*'
      - 'server/tests/cluster*'
      - 'server/cluster-tests/**'
      - '.github/actions/**'
      - '.github/workflows/cluster-consensus.yml'
# New commits supersede older PR runs; independent branch pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: native-cluster
          workspaces: server/cluster-tests -> target
      - run: cargo test --manifest-path server/cluster-tests/Cargo.toml --locked -- --test-threads=1
