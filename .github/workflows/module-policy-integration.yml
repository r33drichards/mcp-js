name: Module Policy Integration Test

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.module-policy.yml
      - policies/**
      - tests/module-policy-integration.sh
      - server/src/**

jobs:
  integration-test:
    name: Module Policy Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build the server image from this checkout, not from the latest release,
      # so the tests exercise the code under test.
      MCP_V8_BUILD: source

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run module policy integration tests
        run: ./tests/module-policy-integration.sh
