name: Scheduler NixOS integration

on:
  pull_request:
    paths:
      - 'scheduler-*/**'
      - 'server/**'
      - 'nix/**'
      - 'tests/nixos/scheduler*'
      - 'tests/nixos/scheduler/**'
      - 'flake.*'
      - '.github/workflows/scheduler-nixos.yml'
  push:
    branches: [main, impl/scheduler-apalis]
    paths:
      - 'scheduler-*/**'
      - 'server/**'
      - 'nix/**'
      - 'tests/nixos/scheduler*'
      - 'tests/nixos/scheduler/**'
      - 'flake.*'
      - '.github/workflows/scheduler-nixos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-nixos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scheduler-nixos:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        check:
          - scheduler-disable-test
          - scheduler-cancellation-test
          - scheduler-disabled-cancellation-test
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
            sandbox = false

      - name: Enable and verify KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          mkdir -p artifacts "$RUNNER_TEMP/nix-build"
          chmod 1777 "$RUNNER_TEMP/nix-build"

      - name: Run NixOS VM test
        shell: bash
        run: |
          set -euo pipefail
          nix build '.#checks.x86_64-linux.${{ matrix.check }}' \
            --print-build-logs --keep-failed --out-link result \
            --option build-dir "$RUNNER_TEMP/nix-build" \
            2>&1 | tee artifacts/build.log

      - name: Collect VM diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -e result ]; then
            cp -RL result artifacts/vm-output
          fi
          if [ -d "$RUNNER_TEMP/nix-build" ]; then
            sudo find "$RUNNER_TEMP/nix-build" -type f \
              \( -name '*.log' -o -name '*.stderr' -o -name '*.jsonl' -o -name log \) \
              -exec cp --parents '{}' "$GITHUB_WORKSPACE/artifacts/" \;
            sudo chown -R "$(id -u):$(id -g)" artifacts
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.check }}-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
