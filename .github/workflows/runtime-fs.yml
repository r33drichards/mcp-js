name: Runtime filesystem regression

on:
  pull_request:
    paths:
      - 'server/src/engine/fs*.rs'
      - 'server/src/engine/heap_storage.rs'
      - 'server/src/engine/heap_storage/**'
      - 'server/src/engine/mod.rs'
      - 'server/tests/fs*.rs'
      - '.github/workflows/runtime-fs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-fs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check fixture formatting
        run: nix develop --command rustfmt --edition 2024 --check server/src/engine/heap_storage/lazy_fs_tests.rs
      - name: Test cold S3 filesystem requests through real V8 executions
        run: timeout 15m nix develop --command cargo test --locked -p server --lib lazy_fs_ -- --test-threads=1 --nocapture
      - name: Test filesystem persistence, policies, caching and compatibility
        run: >-
          nix develop --command cargo test --locked -p server
          --test fs_snapshot_store --test fs_tree --test fs_mount_overlay
          --test fs_snapshot_e2e --test fs_labels_engine --test fs_node_compat
          --test fs_cluster --test fs_large_file -- --test-threads=1
      - name: Test guest filesystem policy hooks
        run: nix develop --command cargo test --locked -p server --test hooks_e2e fs_ -- --test-threads=1
