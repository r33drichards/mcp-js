name: Scheduler core comparison
on:
  pull_request:
    paths:
      - 'scheduler-core/**'
      - '.github/actions/rust-cache/**'
      - '.github/workflows/scheduler-core.yml'
  push:
    branches: ['impl/scheduler-*']
    paths:
      - 'scheduler-core/**'
      - '.github/actions/rust-cache/**'
      - '.github/workflows/scheduler-core.yml'
permissions:
  contents: read
# New commits supersede older PR runs; independent branch pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: native-scheduler-core
          workspaces: scheduler-core -> target
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --example inspect
