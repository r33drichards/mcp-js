<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Narrated companion · presenter-controlled checkpoints</title><style>body{margin:0;background:#101b23;color:#eaf2ef;font:18px/1.5 system-ui;padding:24px}h1{font-size:28px}button,select{font:inherit;background:#203844;color:#eaf2ef;border:1px solid #9df0c1;padding:10px;margin:6px}video{width:100%;max-height:55vh;background:#172833}#checkpoint{border-left:4px solid #f4c778;padding:15px;background:#203844}small{color:#a9bec3}pre{white-space:pre-wrap}button:disabled{opacity:.4}</style><h1>Explain, pause, demonstrate</h1><small>45-minute presentation · animation time is included · original diagrams and stock Easton voice · never a live recording</small><p id="status" role="status">Checking for rendered chapters…</p><select id="chapter" aria-label="Chapter"></select><video id="video" controls preload="metadata" playsinline></video><p id="checkpoint" aria-live="polite"></p><button id="play">Play / resume chapter</button><button id="pause">Pause for live demo</button><button id="next">Presenter resumes next chapter</button><details><summary>Transcript and source notes</summary><pre id="transcript"></pre></details><script>
const $=id=>document.getElementById(id);let chapters=[],board=[],index=0,ready=false;const video=$('video');
function select(i){video.pause();index=i;const c=chapters[i];if(!c)return;video.src='output/'+c.src;$('checkpoint').textContent='Live checkpoint: '+c.checkpoint;$('chapter').value=i;$('next').disabled=i===chapters.length-1;$('status').textContent=c.kind+' — awaiting presenter Play';const story=board.find(x=>x.id===c.id);$('transcript').textContent=story?story.beats.map(x=>x.speech).join('\n\n')+'\n\nSource: '+story.source:'Transcript unavailable';}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='pause-companion')video.pause()});
video.onended=()=>{$('status').textContent='PAUSED FOR LIVE DEMO — no automatic advance';$('checkpoint').focus();};video.onerror=()=>{$('status').textContent='Media unavailable. No narrated playback has been verified.';};
$('play').onclick=()=>{if(ready)video.play().catch(e=>$('status').textContent=e.message)};$('pause').onclick=()=>{video.pause();$('status').textContent='PAUSED BY PRESENTER — resume when ready';};$('next').onclick=()=>{if(index+1<chapters.length)select(index+1)};$('chapter').onchange=()=>select(Number($('chapter').value));
(async()=>{try{board=(await(await fetch('storyboard.json')).json()).chapters;const r=await fetch('output/player-manifest.json');if(!r.ok)throw Error('Chapters have not been rendered on this host.');const m=await r.json();chapters=m.chapters;for(let i=0;i<chapters.length;i++){$('chapter').add(new Option(chapters[i].title,i));}ready=true;select(0);}catch(e){$('status').textContent='SOURCE-ONLY PREPARATION: '+e.message+' See animation/README.md.';for(const id of ['play','pause','next'])$(id).disabled=true;$('checkpoint').textContent='Continue the live presentation with the SVG slides. No substitute or synthetic audio is playing.';}})();
</script></html>
